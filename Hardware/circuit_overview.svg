<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<rect width="1400" height="850" fill="white"/>
<rect x="30" y="25" width="1340" height="90" rx="15" fill="#12385d"/>
<text x="700" y="65" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="white">IoT-Enabled Smart Footwear - Circuit Overview</text>
<text x="700" y="96" text-anchor="middle" font-family="Arial" font-size="20" fill="#eaf3fb">ESP32 + 4 FSR Sensors + DS18B20</text>
<text x="80" y="170" font-family="Arial" font-size="27" font-weight="700">Pressure Sensors</text>
<text x="680" y="170" font-family="Arial" font-size="27" font-weight="700">ESP32</text>
<text x="1010" y="170" font-family="Arial" font-size="27" font-weight="700">Temperature Sensor</text>
<rect x="560" y="210" width="260" height="450" rx="20" fill="#30343b" stroke="#111" stroke-width="3"/>
<text x="690" y="280" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">ESP32</text>
<text x="690" y="330" text-anchor="middle" font-family="Arial" font-size="20" fill="white">GPIO34 - FSR1</text>
<text x="690" y="390" text-anchor="middle" font-family="Arial" font-size="20" fill="white">GPIO35 - FSR2</text>
<text x="690" y="450" text-anchor="middle" font-family="Arial" font-size="20" fill="white">GPIO32 - FSR3</text>
<text x="690" y="510" text-anchor="middle" font-family="Arial" font-size="20" fill="white">GPIO33 - FSR4</text>
<text x="690" y="570" text-anchor="middle" font-family="Arial" font-size="20" fill="white">GPIO4 - DS18B20 DQ</text>
<text x="120" y="250" font-family="Arial" font-size="22" font-weight="700">FSR1</text><circle cx="200" cy="245" r="28" fill="white" stroke="#e74c3c" stroke-width="5"/><text x="250" y="252" font-family="Arial" font-size="18">10 kΩ to GND</text><line x1="228" y1="245" x2="545" y2="330" stroke="#e74c3c" stroke-width="5"/>
<text x="120" y="350" font-family="Arial" font-size="22" font-weight="700">FSR2</text><circle cx="200" cy="345" r="28" fill="white" stroke="#f1c40f" stroke-width="5"/><text x="250" y="352" font-family="Arial" font-size="18">10 kΩ to GND</text><line x1="228" y1="345" x2="545" y2="390" stroke="#f1c40f" stroke-width="5"/>
<text x="120" y="450" font-family="Arial" font-size="22" font-weight="700">FSR3</text><circle cx="200" cy="445" r="28" fill="white" stroke="#27ae60" stroke-width="5"/><text x="250" y="452" font-family="Arial" font-size="18">10 kΩ to GND</text><line x1="228" y1="445" x2="545" y2="450" stroke="#27ae60" stroke-width="5"/>
<text x="120" y="550" font-family="Arial" font-size="22" font-weight="700">FSR4</text><circle cx="200" cy="545" r="28" fill="white" stroke="#2980b9" stroke-width="5"/><text x="250" y="552" font-family="Arial" font-size="18">10 kΩ to GND</text><line x1="228" y1="545" x2="545" y2="510" stroke="#2980b9" stroke-width="5"/>
<rect x="965" y="235" width="190" height="100" rx="12" fill="#252525"/><text x="1060" y="292" text-anchor="middle" font-family="Arial" font-size="20" fill="white">DS18B20</text>
<text x="965" y="385" font-family="Arial" font-size="18" font-weight="700">DQ → GPIO4</text><text x="965" y="420" font-family="Arial" font-size="18" font-weight="700">VDD → 3.3V</text><text x="965" y="455" font-family="Arial" font-size="18" font-weight="700">GND → GND</text>
<text x="965" y="510" font-family="Arial" font-size="18" font-weight="700">4.7 kΩ pull-up</text><text x="965" y="540" font-family="Arial" font-size="16">between DQ and 3.3V</text>
<line x1="1155" y1="385" x2="825" y2="570" stroke="#7b3fb3" stroke-width="5"/>
<line x1="1155" y1="420" x2="1200" y2="420" stroke="#e74c3c" stroke-width="5"/>
<line x1="1155" y1="455" x2="1200" y2="455" stroke="#111" stroke-width="5"/>
<rect x="70" y="700" width="1260" height="85" rx="12" fill="#eef4f8" stroke="#9bb0c1"/>
<text x="700" y="735" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Final GPIO Mapping</text>
<text x="700" y="765" text-anchor="middle" font-family="Arial" font-size="18">FSR1→34  •  FSR2→35  •  FSR3→32  •  FSR4→33  •  DS18B20 DQ→4  •  FSR resistor=10 kΩ  •  DS18B20 pull-up=4.7 kΩ</text>
</svg>